<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UFVet | Doação de Sangue Animal</title>
    <!-- Abre a conexão com o Google Fonts antes, para as fontes chegarem mais cedo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- O círculo vermelho de "carregando" enquanto o site abre: o mesmo de
         components/Carregando.jsx, feito só com CSS, porque o React ainda
         não chegou. Ao montar, o React troca tudo o que está dentro do root. -->
    <style>
      .abrindo {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 4px solid rgba(158, 10, 36, 0.18);
        border-top-color: #9e0a24;
        animation: abrindo-gira 0.8s linear infinite;
      }
      @keyframes abrindo-gira {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .abrindo {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="abrindo" role="status" aria-label="Carregando o UFVet"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
