# A receita de publicação do UFVet no Render (Blueprint): um serviço só, que
# monta o site e entrega o site e a API no mesmo endereço. O banco fica no
# Neon. O passo a passo está em backend/README.md, na seção "Publicação".
services:
  - type: web
    name: ufvet
    runtime: node
    plan: free
    # Perto do banco (Neon, AWS US East 1): cada página faz várias consultas,
    # e a distância entre a API e o banco pesa em todas.
    region: virginia
    # Monta o site, prepara a API e atualiza o banco. As migrações rodam aqui
    # porque, no plano grátis, o Render não tem o passo "antes de ligar"; a
    # carga inicial (o hospital) pode rodar sempre, sem duplicar nada. O
    # --include=dev é preciso porque, com NODE_ENV=production, o npm pularia
    # as ferramentas de montagem (Vite, Prisma).
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npm run db:generate &&
      npx prisma migrate deploy && npm run db:seed
    startCommand: cd backend && npm start
    healthCheckPath: /api/saude
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      # Quantos intermediários (proxies) o pedido atravessa até a API: a
      # Cloudflare, que o Render usa na frente, e os do próprio Render. Com
      # menos, o limite de tentativas contava pelo endereço de um deles (que
      # muda a cada conexão), e não pelo de quem fez o pedido; com mais,
      # quem forjasse o cabeçalho X-Forwarded-For escaparia do limite. O
      # Render não documenta esse número: ele foi conferido no site
      # publicado, comparando a chave do limite (cabeçalho RateLimit-Policy)
      # com o endereço de quem pediu.
      - key: PROXIES_CONFIAVEIS
        value: "3"
      # Os segredos são colados no painel do Render ao criar o serviço, nunca
      # aqui: o repositório é público.
      - key: DATABASE_URL
        sync: false
      - key: CHAVE_CIFRAGEM
        sync: false
      - key: CHAVE_INDICE
        sync: false
      # Esta o próprio Render sorteia: trocá-la só desconecta todo mundo.
      - key: JWT_SEGREDO
        generateValue: true
